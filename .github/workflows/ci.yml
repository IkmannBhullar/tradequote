# Continuous Integration: runs the same `make` targets you run locally, on
# every push to main and every pull request. If it's red, don't merge.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# If you push again while a run for the same branch is still going, cancel the
# old run. Its result would be stale anyway.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: CI only needs to read the code.
permissions:
  contents: read

jobs:
  # Backend and frontend run as separate jobs, so they run in parallel and a
  # failure clearly points at one side.
  backend:
    runs-on: ubuntu-latest
    env:
      # CI has no .env file; config comes from env vars, same as production.
      # Postgres is started by `make db-up` (docker compose), on host port 5433.
      DATABASE_URL: postgresql+psycopg://tradequote:tradequote@localhost:5433/tradequote
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0  # this action publishes no floating major tag
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      # --locked fails if uv.lock is out of date with pyproject.toml, so a
      # forgotten lockfile update is caught here instead of drifting silently.
      - name: Install dependencies
        working-directory: backend
        run: uv sync --locked

      - name: Lint, type-check, test
        run: make backend-verify

      # The frontend's API types are generated from this schema. If an
      # endpoint changed without regenerating them (`make api-types`), fail.
      - name: OpenAPI schema is up to date
        run: |
          cd backend && uv run python -m app.export_openapi > ../frontend/openapi.json
          git diff --exit-code -- frontend/openapi.json

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Generated API types are up to date
        working-directory: frontend
        run: |
          npm run gen:api
          git diff --exit-code -- src/lib/api/schema.d.ts

      - name: Lint, type-check, unit tests
        run: make frontend-verify

      # A production build catches errors lint/tsc can't (e.g. a page that
      # fails to prerender). Too slow for every local `make verify`, fine here.
      - name: Build
        working-directory: frontend
        run: npm run build

  # The whole stack in a real browser: production Next.js build + FastAPI +
  # Postgres. Slower, so it runs in its own job, in parallel with the others.
  e2e:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+psycopg://tradequote:tradequote@localhost:5433/tradequote
      # A throwaway value for this CI run only; never used anywhere real.
      JWT_SECRET: ci-e2e-only-jwt-secret-0123456789abcdefghijklmnop
      API_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd backend && uv sync --locked
          cd ../frontend && npm ci
          npx playwright install --with-deps chromium

      # Starts Postgres, migrates, seeds templates, builds, runs Playwright.
      - name: End-to-end tests
        run: make e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
