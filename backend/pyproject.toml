[project]
name = "tradequote-backend"
version = "0.1.0"
description = "TradeQuote API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "email-validator>=2.3.0",
    "fastapi>=0.141.1",
    "jinja2>=3.1.6",
    "psycopg[binary]>=3.3.6",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.0",
    "sqlalchemy>=2.1.1",
    "tzdata>=2026.4",
    "uvicorn[standard]>=0.54.0",
    "weasyprint>=70.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "hypothesis>=6.168.1",
    "mypy>=2.3.1",
    "pypdf>=6.19.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.9",
]

# ---------------------------------------------------------------------------
# Ruff: linter + formatter (replaces flake8, isort, black, pyupgrade...).
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes (unused imports, undefined names), I import
# sorting, B bugbear (likely bugs), UP modern-syntax upgrades, SIM
# simplifications, N naming, RUF ruff-specific checks.
select = ["E", "W", "F", "I", "B", "UP", "SIM", "N", "RUF"]

[tool.ruff.lint.isort]
# Our backend/alembic/ *folder* would otherwise make ruff think the `alembic`
# *package* is our own code, and sort its imports inconsistently.
known-first-party = ["app", "tests"]
known-third-party = ["alembic"]

# ---------------------------------------------------------------------------
# Mypy: static type checking. `strict` means every function must be fully
# annotated and implicit `Any` is an error — cheap to start with, painful to
# retrofit later.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

# WeasyPrint ships no type hints. Scope the exception to that one library;
# everything else stays strictly checked.
[[tool.mypy.overrides]]
module = ["weasyprint", "weasyprint.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
# Fail on unknown markers and treat warnings as errors so deprecations get
# noticed early instead of piling up silently.
# -rs: always print WHY a test was skipped, so skips can't go unnoticed.
addopts = "--strict-markers -rs"
filterwarnings = ["error"]
markers = [
    "pdf: renders real PDFs; needs WeasyPrint's system libraries (Pango)",
]
