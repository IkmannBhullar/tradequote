# Alembic configuration.
#
# NOTE: there is deliberately no `sqlalchemy.url` here. The database URL comes
# from the DATABASE_URL environment variable via app.config.Settings (see
# alembic/env.py). That keeps secrets out of git and avoids a classic bug: this
# file is parsed by Python's configparser, which treats "%" specially, so a
# percent-encoded password (e.g. "p%40ss") in a URL here would break Alembic.

[alembic]
script_location = %(here)s/alembic
# Put backend/ on sys.path so env.py can `import app`.
prepend_sys_path = .
path_separator = os
# Date-prefixed migration files sort chronologically in the file browser:
#   2026_09_25_1f2e3d4c5b6a_initial_schema.py
# ("%%" is an escaped "%" for configparser.)
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(rev)s_%%(slug)s

[post_write_hooks]
# After `alembic revision` writes a new file, format then lint-fix it so
# generated migrations pass `make lint` without hand edits.
hooks = ruff_format, ruff_fix
ruff_fix.type = exec
ruff_fix.executable = %(here)s/.venv/bin/ruff
ruff_fix.options = check --fix REVISION_SCRIPT_FILENAME
ruff_format.type = exec
ruff_format.executable = %(here)s/.venv/bin/ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

# --- Logging (used when running the `alembic` command) ---
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
